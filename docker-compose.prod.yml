services:
  db:
    image: postgres:16-alpine
    container_name: gingin-forecast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gingin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gingin_forecast
    volumes:
      - gingin_forecast_data:/var/lib/postgresql/data
    networks:
      - root_default
    # No "ports:" here on purpose -- Postgres only needs to be reachable
    # from the app container over the shared network, not from the host.

  app:
    build:
      context: .
      target: runner
      args:
        # NEXT_PUBLIC_* vars must be present at BUILD time (see Dockerfile) --
        # this is what actually gets them there, sourced from .env.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: gingin-forecast-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://gingin:${DB_PASSWORD}@db:5432/gingin_forecast
      SOURCE_REF: ${SOURCE_REF:-./data/orders-with-dates.xlsx}
      MONTHLY_SOURCE_REF: ${MONTHLY_SOURCE_REF:-./data/quarter-sales.xls}
      # Also passed at runtime so any server-side Supabase client (not just
      # the build-time-baked browser bundle) has these too.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    volumes:
      - ./data:/app/data
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gingin-forecast.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.gingin-forecast.entrypoints=web,websecure"
      - "traefik.http.routers.gingin-forecast.tls=true"
      - "traefik.http.routers.gingin-forecast.tls.certresolver=mytlschallenge"
      - "traefik.http.services.gingin-forecast.loadbalancer.server.port=3000"
      # No Traefik-level auth middleware anymore -- login is handled inside
      # the app now via Supabase (see src/middleware.ts). Real user
      # accounts, created directly in the Supabase dashboard, protect
      # every page and every /api/* route.

  # One-off tasks (migrations, re-imports) run through `toolchain`, which
  # has the Prisma CLI and generated client but skips the Next.js build
  # entirely -- previously this targeted `builder`, which meant every
  # migration/import also rebuilt the full production app for no reason.
  # Usage:
  #   docker compose -f docker-compose.prod.yml run --rm migrate npx prisma migrate deploy
  #   docker compose -f docker-compose.prod.yml run --rm migrate npm run import
  migrate:
    build:
      context: .
      target: toolchain
    environment:
      DATABASE_URL: postgresql://gingin:${DB_PASSWORD}@db:5432/gingin_forecast
      SOURCE_REF: ${SOURCE_REF:-./data/orders-with-dates.xlsx}
      MONTHLY_SOURCE_REF: ${MONTHLY_SOURCE_REF:-./data/quarter-sales.xls}
    volumes:
      - ./data:/app/data
      - ./prisma:/app/prisma
    networks:
      - root_default
    profiles: ["tools"] # excluded from a normal `docker compose up`

networks:
  root_default:
    external: true

volumes:
  gingin_forecast_data: